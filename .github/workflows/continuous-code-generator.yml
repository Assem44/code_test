name: Continuous Code Generator

on:
  schedule:
    - cron: '0 0 * * *'  # يعمل تلقائياً كل يوم الساعة 12 منتصف الليل
  workflow_dispatch:      # يتيح لك تشغيله يدوياً بضغطة زر في أي وقت

# إعطاء صلاحية الكتابة للمستودع لحفظ الملفات المحدثة بنجاح
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # جلب آخر كومت فقط لتسريع العملية وتوفير المساحة

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Generator Script
      run: |
        # تشغيل السكربت ووضع مهلة 5 ساعات ونصف (330 دقيقة) لحفظ البيانات بسلام
        timeout 330m python3 script.py || true

    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 🟢 تكوين الجيت للتعامل مع الملفات الكبيرة وضمان عدم فشل الـ Push
        git config --global http.postBuffer 524288000
        git config --global core.compression 9

        # فحص وجود المجلد قبل محاولة رفعه
        if [ -d "generated_vault" ]; then
          git add generated_vault/
          
          # التحقق من وجود تغييرات فعلياً لعمل الـ Commit
          if ! git diff-index --quiet HEAD; then
            git commit -m "💾 تحديث تلقائي: إضافة الأكواد اليومية وحساب السطور"
            
            # 🟢 عمل pull ذكي لتفادي أي تعارض قبل الرفع
            git pull --rebase origin main || echo "لا يوجد تعارضات للدمج"
            
            # الرفع للمستودع
            git push origin HEAD
          else
            echo "💡 لا توجد أكواد جديدة ليتم رفعها."
          fi
        else
          echo "⚠️ المجلد غير موجود حالياً، سيتم الرفع في المرة القادمة عند إنشائه."
        fi
