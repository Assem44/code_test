name: Continuous Code Generator

on:
  schedule:
    - cron: '0 0 * * *'  # يعمل تلقائياً كل يوم الساعة 12 منتصف الليل
  workflow_dispatch:      # يتيح لك تشغيله يدوياً بضغطة زر في أي وقت

# إعطاء صلاحية الكتابة للمستودع لحفظ الملفات المحدثة بنجاح
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Generator Script
      run: |
        # تشغيل السكربت في الخلفية وتحديد مهلة قصوى 5 ساعات ونصف (330 دقيقة) لحفظ البيانات قبل الـ 6 ساعات الإجبارية
        # ⚠️ ملاحظة: تأكد من تغيير "your_script_name.py" لاسم ملفك الفعلي
        timeout 330m python3 script.py || true

    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add generated_vault/
        git diff-index --quiet HEAD || git commit -m "💾 تحديث تلقائي: إضافة الأكواد اليومية وحساب السطور"
        git push
